<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Goal</title>
    <link rel="stylesheet" href="../css/goal.css">
</head>
<body>
 <div>

    
 </div>

<div class="goal-container">
 <a href="dashboard.html">
                   <img src="left.png" alt="" width="20px" height="29px"> 



                </a>
    <h1>Set Your Fitness Goal</h1>

    <form id="goalForm">

        <input
            type="text"
            id="goalName"
            placeholder="Goal Name">

        <input
            type="number"
            id="goalTarget"
            placeholder="Target Number of Workouts">

        <button type="submit">
            Save Goal
        </button>

    </form>

    <div class="current-goal">

        <h2>Current Goal</h2>

        <p id="goalDisplay">
            No goal set yet
        </p>

    </div>

</div>

<script src="../javascript/goal.js"></script>

</body>
</html>
