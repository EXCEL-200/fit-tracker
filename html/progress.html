<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <link rel="stylesheet" href="../css/progress.css">
</head>
<div class="container">
             
 <a href="dashboard.html">
                   <img src="left.png" alt="" width="20px" height="29px"> 
                </a>

    <h1>My Fitness Progress</h1>

    <div class="progress-card">

        <h2>Goal Progress</h2>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill">
                0%
            </div>
        </div>

        <p id="progressText">
            You have completed 0% of your goal.
        </p>
<div class="progress-inputs">

    <input
        type="number"
        id="caloriesBurned"
        placeholder="Calories Burned">

    <input
        type="number"
        id="dayStreak"
        placeholder="Day Streak">

    <button id="saveProgressBtn">
        Save Progress
    </button>

</div>
    </div>

    <div class="stats">

        <div class="card">
            <h3 id="workoutCount">0</h3>
            <p>Workouts Completed</p>
        </div>

        <div class="card">
            <h3 id="exerciseCount">0</h3>
            <p>Exercises Logged</p>
        </div>

        <div class="card">
            <h3 id="goalStatus">Starting</h3>
            <p>Status</p>
        </div>

    </div>

</div>

<script src="../javasript/progress.js"></script>

</body>
</html>
